            <button class="sb-item is-on" onclick="smNavigate('news')" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.2h7.6L18 7.6V20.8H6z"/><path d="M13.4 3.2v4.6H18"/><path d="M9 12.2h6M9 15.6h6M9 8.8h2.6"/></svg><span>新闻</span></button>

            <button class="sb-item" onclick="smNavigate('msg')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7.4A2.4 2.4 0 0 1 6.9 5h10.2a2.4 2.4 0 0 1 2.4 2.4v6.2a2.4 2.4 0 0 1-2.4 2.4H9.4L4.5 19.6z"/></svg><span>消息</span><span class="sb-badge" id="smMsgBadge" hidden></span></button>
            <button class="sb-item" onclick="smNavigate('me')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.2" r="3.7"/><path d="M4.9 20.4c.55-3.75 3.65-5.9 7.1-5.9s6.55 2.15 7.1 5.9"/></svg><span>我的</span></button>

            <button class="sb-item" onclick="smNavigate('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg><span>设置</span></button>
        </nav>

            <a class="sb-login" id="sbLogin" href="/signin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4.5H5.8A1.8 1.8 0 0 0 4 6.3v11.4a1.8 1.8 0 0 0 1.8 1.8H10"/><path d="M11 12h9M16.6 8.6 20 12l-3.4 3.4"/></svg><span>登录</span></a>
            <a class="sb-dl" href="/download"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6v10"/><path d="M7.7 9.5 12 13.8l4.3-4.3"/><path d="M4.6 16v2.6A1.8 1.8 0 0 0 6.4 20.4h11.2a1.8 1.8 0 0 0 1.8-1.8V16"/></svg><span>下载客户端</span></a>
            <button class="sb-theme" onclick="pnToggleTheme()" aria-label="切换明暗主题" title="切换明暗主题">
                <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.4A8.4 8.4 0 0 1 9.6 4 8.4 8.4 0 1 0 20 14.4z"/></svg>

    <!-- 顶部公告条 -->
    <div class="pn-annbar" id="annBar">
        <span class="pn-annbar-badge">公告</span>
        <div class="pn-annbar-text" id="annBarText">翱翔鸟·新闻中心：聚合 66+ 权威信源，每 10 分钟自动刷新；内容仅供学习交流，观点归原作者所有，不代表本站立场。</div>
        <button class="pn-annbar-close" id="annBarClose" type="button" title="关闭公告" aria-label="关闭公告">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
    </div>

    <nav class="nav-bar">
        <div class="nav-inner">
            <a class="pn-back-forum" href="/" title="返回论坛">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
                <span>论坛</span>
            </a>
            <div class="nav-spacer"></div>
            <div class="nav-actions">
                <button class="pn-icon-btn" id="menuNavBtn" type="button" title="菜单" aria-label="菜单">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                </button>
                <a class="btn-login" href="/signin" id="navLoginBtn" style="text-decoration:none;display:inline-block">登录</a>
                <div class="pn-user" id="navUser" style="display:none">
                    <img class="pn-avatar" id="navAvatar" alt="" src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='20' fill='%23e8ebef'/%3E%3Ccircle cx='20' cy='16' r='6.5' fill='%23a9b3c0'/%3E%3Cpath d='M7.5 36c1.6-7 6.3-10.5 12.5-10.5S30.9 29 32.5 36z' fill='%23a9b3c0'/%3E%3C/svg%3E">
                    <span class="pn-username" id="navUsername"></span>
                </div>
            </div>
        </div>
    </nav>

    <main class="pn-main">
        <!-- 站点标题行（body 上端）：标题黑字 + 日期在标题右侧 + 发帖按钮最右（橙底白字，与标题基线对齐） -->
        <div class="pn-site-head">
            <h1 class="pn-site-title">Peacenews.<span class="pn-site-title-sub">新闻中心</span></h1>
            <div class="pn-site-date" id="siteDate"></div>
            <div class="site-head-spacer"></div>
            <button class="pn-publish-btn pn-site-publish" id="publishBtn" type="button">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>发布新闻
            </button>
        </div>
        <!-- 列表视图 -->
        <section id="listView">
            <!-- 顶栏：股市、天气各自一个圆角矩形容器（仅内部内容滚动，外框不动）；下方快讯一行一条 -->
            <div class="pn-topbar" id="topbar">
                <div class="pn-tb-row pn-tb-panel" id="tbRowStock">
                    <div class="pn-tb-track" id="tbStockTrack"></div>
                </div>
                <div class="pn-tb-row pn-tb-panel" id="tbRowWeather">
                    <div class="pn-tb-track" id="tbWeatherTrack"></div>
                </div>
                <div class="pn-tb-row pn-tb-flash-row" id="tbRowFlash">
                    <div class="pn-tb-track pn-tb-flash-track" id="tbFlashTrack"></div>
                </div>
            </div>
            <!-- 核心内容区：左轮播大图 + 右头条列表 -->
            <div class="pn-headline" id="headline" style="display:none">
                <div class="pn-carousel" id="carousel"></div>
                <aside class="pn-hlist" id="hlist"></aside>
            </div>

            <!-- 筛选区：时间下拉 + 分类标签，整体居中对齐；时间筛选为非原生下拉，位于"全部"标签左侧 -->
            <div class="pn-filterbar" id="filterBar">
                <div class="pn-category-bar" id="categoryBar" role="tablist" aria-label="分类筛选">
                    <div class="pn-time-drop" id="timeDrop">
                        <button class="pn-time-trigger" id="timeDropBtn" type="button" aria-haspopup="true" aria-expanded="false">全部时间</button>
                        <div class="pn-time-menu" id="timeMenu" role="menu">
                            <button class="pn-time-opt" data-days="0" type="button" role="menuitem">全部时间</button>
                            <button class="pn-time-opt" data-days="1" type="button" role="menuitem">今天</button>
                            <button class="pn-time-opt" data-days="3" type="button" role="menuitem">近3天</button>
                            <button class="pn-time-opt active" data-days="7" type="button" role="menuitem">近7天</button>
                            <button class="pn-time-opt" data-days="30" type="button" role="menuitem">近30天</button>
                        </div>
                    </div>
                    <button class="pn-cat-chip active" data-cat="">全部</button>
                    <button class="pn-cat-chip" data-cat="时事">时事</button>
                    <button class="pn-cat-chip" data-cat="社会">社会</button>
                    <button class="pn-cat-chip" data-cat="经济">经济</button>
                    <button class="pn-cat-chip" data-cat="体育">体育</button>
                    <button class="pn-cat-chip" data-cat="科技">科技</button>
                    <button class="pn-cat-chip" data-cat="娱乐">娱乐</button>
                    <button class="pn-cat-chip" data-cat="人文">人文</button>
                    <button class="pn-cat-chip" data-cat="生活">生活</button>
                    <button class="pn-cat-chip" data-cat="环境">环境</button>
                    <button class="pn-cat-chip pn-cat-green" data-cat="社群">社群</button>
                </div>
            </div>

            <div class="pn-grid" id="newsGrid"></div>
            <div class="pn-empty" id="newsEmpty" style="display:none">
                <div class="pn-empty-title" id="emptyTitle">暂无新闻</div>
                <div class="pn-empty-hint" id="emptyHint">换个分类或时间范围试试</div>
            </div>
            <!-- 瀑布流无限加载占位 -->
            <div class="pn-more" id="moreBox"><span id="moreText">加载中…</span></div>
        </section>

        <!-- 详情视图 -->
        <section id="detailView" style="display:none">
            <button class="pn-back" id="backBtn">← 返回列表</button>
            <div class="pn-detail-layout">
            <div class="pn-detail-main">
            <article class="pn-detail">
                <h2 class="pn-detail-title" id="dTitle"></h2>
                <div class="pn-detail-orig" id="dOrigTitle" style="display:none"></div>
                <div class="pn-detail-meta">
                    <img class="pn-avatar" id="dAvatar" alt="" src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='20' fill='%23e8ebef'/%3E%3Ccircle cx='20' cy='16' r='6.5' fill='%23a9b3c0'/%3E%3Cpath d='M7.5 36c1.6-7 6.3-10.5 12.5-10.5S30.9 29 32.5 36z' fill='%23a9b3c0'/%3E%3C/svg%3E">
                    <span class="pn-author" id="dAuthor"></span>
                    <span class="pn-time" id="dTime"></span>
                    <button class="pn-edit-btn" id="dEditBtn" style="display:none">编辑</button>
                    <button class="pn-delete-btn" id="dDeleteBtn" style="display:none">删除</button>
                </div>
                <img class="pn-detail-cover" id="dCover" alt="" style="display:none">
                <video class="pn-detail-cover" id="dVideo" controls preload="metadata" playsinline style="display:none"></video>
                <div class="pn-detail-content" id="dContent"></div>
                <div class="pn-detail-trans" id="dTranslateArea" style="display:none">
                    <button class="pn-edit-btn" id="dTranslateBtn">实时翻译</button>
                    <div class="pn-detail-trans-box" id="dTranslateBox" style="display:none"></div>
                </div>
                <div class="pn-detail-actions">
                    <button class="pn-like-btn" id="dLikeBtn">
                        <svg class="pn-icon-heart" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                        <span id="dLikeCount">0</span>
                    </button>
                    <button class="pn-like-btn pn-report-btn" id="dReportBtn" title="举报" onclick="reportNews()">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4"/><path d="M6 4c3-1 6.5-1 9 0v9c-2.5-1-6-1-9 0"/></svg>
                    </button>
                </div>
            </article>

            <div class="pn-related" id="relatedSection" style="display:none">
                <h2 class="pn-related-title">相关新闻 · 多信源聚合</h2>
                <div class="pn-related-note" id="relatedNote"></div>
                <div class="pn-related-list" id="relatedList"></div>
            </div>

            <div class="pn-comments">
                <h2 class="pn-comments-title">评论 <span id="cCount">0</span></h2>
                <div class="pn-stance-panel" id="stancePanel" style="display:none">
                    <div class="pn-stance-head">
                        <span class="pn-stance-title">观点对撞</span>
                        <span class="pn-stance-note">同一事件，不同看法 · 真实评论按立场归位</span>
                    </div>
                    <div class="pn-stance-cols">
                        <div class="pn-stance-col pn-stance-pro">
                            <div class="pn-stance-col-title">赞成 · 支持</div>
                            <div class="pn-stance-list" id="stanceProList"></div>
                            <div class="pn-stance-empty" id="stanceProEmpty">暂无「赞成」观点评论</div>
                        </div>
                        <div class="pn-stance-col pn-stance-anti">
                            <div class="pn-stance-col-title">反对 · 质疑</div>
                            <div class="pn-stance-list" id="stanceAntiList"></div>
                            <div class="pn-stance-empty" id="stanceAntiEmpty">暂无「反对」观点评论</div>
                        </div>
                    </div>
                </div>
                <div id="commentList"></div>
                <button class="pn-page-btn pn-comment-more" id="commentMore" style="display:none">加载更多评论</button>
                <div class="pn-comment-box">
                    <div class="pn-stance-picker" id="stancePicker" style="display:none">
                        <span class="pn-stance-picker-label">我的观点：</span>
                        <button class="pn-stance-opt active" data-stance="中立" type="button">中立</button>
                        <button class="pn-stance-opt" data-stance="赞成" type="button">赞成</button>
                        <button class="pn-stance-opt" data-stance="反对" type="button">反对</button>
                    </div>
                    <textarea id="commentInput" class="pn-textarea" placeholder="写下你的评论…（国际/社会类新闻可选择立场，观点将按立场归入对撞栏）" rows="3"></textarea>
                    <div class="pn-comment-tools">
                        <button class="btn-login" id="commentSubmit">发表评论</button>
                    </div>
                </div>
            </div>
            </div>
            <aside class="pn-agent-side" id="agentSide">
                <div class="pn-agent-card">
                    <div class="pn-agent-head">
                        <span class="pn-agent-title">AI 分析</span>
                    </div>
                    <div class="pn-agent-summary-pane" id="agentSummaryPane"></div>
                    <div class="pn-agent-analysis-pane" id="agentAnalysisPane"></div>
                    <div class="pn-agent-body" id="agentBody">
                        <p class="pn-agent-tip">正在评估本条新闻适合哪些智能体视角…</p>
                    </div>
                </div>
            </aside>
            </div>
        </section>
    </main>

    <!-- 发布模态框 -->
    <div class="modal-overlay" id="publishModal">
        <div class="pn-modal">
            <div class="pn-modal-head">
                <h2 class="pn-modal-title" id="mModalTitle">发布新闻</h2>
                <button class="pn-fullscreen-btn" id="mFullscreenBtn" title="全屏编辑">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                </button>
            </div>
            <input type="text" id="mTitle" class="pn-input" placeholder="标题" maxlength="120">
            <input type="text" id="mSummary" class="pn-input" placeholder="摘要（选填，用于列表展示，留空自动截取）" maxlength="200" style="margin-bottom:14px">
            <div class="pn-edit-tabs">
                <button class="pn-edit-tab active" id="mTabEdit" type="button">编辑</button>
                <button class="pn-edit-tab" id="mTabPreview" type="button">预览</button>
            </div>
            <!-- 工具栏 -->

    <script>
    (function () {
        function toggleSectionMenu(e) {
            if (e) e.stopPropagation();
            var menu = document.getElementById('sectionMenu');
            if (!menu) return;
            var willOpen = !menu.classList.contains('open');
            closeSectionMenu();
            if (willOpen) {
                menu.classList.add('open');
                setTimeout(function () { document.addEventListener('click', closeSectionMenu); }, 0);
            }
        }
        function closeSectionMenu() {
            var menu = document.getElementById('sectionMenu');
            if (menu) menu.classList.remove('open');
            document.removeEventListener('click', closeSectionMenu);
        }
        window.smNavigate = function (page) {
            closeSectionMenu();
            if (page === 'home') window.location.href = '/';
            else if (page === 'live') window.location.href = '/live';
            else if (page === 'news') window.location.href = '/peacenews';
            else if (page === 'ai') window.location.href = '/ai';
            else if (page === 'msg') window.location.href = '/?open=msg';
            else if (page === 'me') window.location.href = '/?open=me';
            else if (page === 'settings') window.location.href = '/?open=settings';
        };
        var menuBtn = document.getElementById('menuNavBtn');
        if (menuBtn) menuBtn.addEventListener('click', toggleSectionMenu);
        // 同步消息未读角标
        function updateSmBadge() {
            var badge = document.getElementById('smMsgBadge');
            if (!badge) return;
            if (window.userId) {
                try {
                    fetch('/api/notifications').then(function (r) { return r.json(); }).then(function (data) {
                        var unread = (data.notifications || []).filter(function (n) { return !n.read; }).length;
                        badge.hidden = !(unread > 0);
                    }).catch(function () {});
                } catch (e) {}
            } else {
                badge.hidden = true;
            }
        }
        updateSmBadge();
        setInterval(updateSmBadge, 60000);
    })();
    </script>

<script>
/* ============ 方格纸版侧栏：明暗主题切换 + 登录态 ============ */
function pnToggleTheme() {
    var d = document.documentElement;
    var toDark = d.getAttribute('data-theme') !== 'dark';
    if (toDark) d.setAttribute('data-theme', 'dark');
    else d.removeAttribute('data-theme');
    try { localStorage.setItem('bird_theme', toDark ? 'dark' : 'light'); } catch (e) {}
    var logo = document.querySelector('.sb-brand .sb-logo');
    if (logo) logo.src = toDark ? 'logo-dark.png' : 'logo-light.png';
}
(function () {
    // 首屏同步 logo（内联脚本已在 <head> 设置 data-theme）
    if (document.documentElement.getAttribute('data-theme') === 'dark') {
        var l = document.querySelector('.sb-brand .sb-logo');
        if (l) l.src = 'logo-dark.png';
    }
    // 侧栏底部：登录态（未登录→登录按钮；已登录→头像）
    fetch('/api/me', { credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
            var u = (d && d.user) || d;
            if (!u || !u.id) return;
            window.userId = u.id;
            var login = document.getElementById('sbLogin');
            var box = document.getElementById('sbUser');
            if (login) login.style.display = 'none';
            if (box) {
                box.style.display = 'flex';
                box.title = u.username || '账户';
                var av = document.getElementById('sbAvatar');
                if (av) {
                    if (u.avatar) {
                        av.style.backgroundImage = 'url(' + u.avatar + ')';
                        av.style.backgroundSize = 'cover';
                        av.style.backgroundPosition = 'center';
                        av.textContent = '';
                    } else {
                        av.textContent = (u.username || '?').slice(0, 1).toUpperCase();
                    }
                }
            }
        })
        .catch(function () {});
})();
</script>
