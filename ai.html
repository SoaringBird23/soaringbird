<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bird AI</title>
<link rel="icon" href="logo-light.png" type="image/png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;
  background:#ECECEE;color:#1D1D1F;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow:hidden;
}

/* ===== 窗口 ===== */
.ai-window{
  display:flex;height:100vh;width:100vw;
  border-radius:12px;overflow:hidden;
  background:#FFFFFF;
  animation:aiWinIn .35s cubic-bezier(.32,.72,0,1) both;
}
@keyframes aiWinIn{from{opacity:0;transform:scale(.985) translateY(6px)}to{opacity:1;transform:none}}

/* ===== 左侧栏 ===== */
.ai-sidebar{
  width:33.333%;min-width:250px;flex-shrink:0;
  background:#F5F5F5;border-right:1px solid #E6E6E6;
  display:flex;flex-direction:column;overflow:hidden;
}
.ai-sidebar-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 18px 12px;flex-shrink:0;
}
.ai-brand{font-size:17px;font-weight:700;letter-spacing:-.02em;color:#1D1D1F}
.ai-back{
  width:28px;height:28px;border-radius:50%;border:1px solid #E6E6E6;cursor:pointer;
  background:rgba(255,255,255,.7);color:#8E8E93;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .15s ease,color .15s ease;
}
.ai-back:hover{transform:scale(1.08);background:#fff;color:#1D1D1F}
.ai-back:active{transform:scale(.9)}

/* 搜索框 */
.ai-sidebar-search{
  margin:0 12px 8px;height:34px;flex-shrink:0;position:relative;
  opacity:0;pointer-events:none;transform:translateY(-4px);
  transition:opacity .18s ease,transform .18s ease;
}
.ai-sidebar-search.open{opacity:1;pointer-events:auto;transform:none}
.ai-sidebar-search input{
  width:100%;height:100%;border:1px solid #E6E6E6;border-radius:9px;background:#fff;
  padding:0 30px 0 12px;font-size:13px;color:#1D1D1F;outline:none;
}
.ai-sidebar-search input::placeholder{color:#AEAEB2}
.ai-sidebar-search .ss-clear{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;border:none;border-radius:50%;cursor:pointer;
  background:#E9E9EB;color:#8E8E93;display:flex;align-items:center;justify-content:center;
}

/* 对话列表 */
.ai-conv-list{flex:1;overflow-y:auto;padding:4px 8px 16px;scrollbar-width:thin;scrollbar-color:#E1E1E4 transparent}
.ai-conv-list::-webkit-scrollbar{width:5px}
.ai-conv-list::-webkit-scrollbar-thumb{background:#E1E1E4;border-radius:3px}
.ai-conv-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:11px 12px;border-radius:10px;cursor:pointer;border:none;background:none;
  text-align:left;transition:background .12s ease;
}
.ai-conv-item:hover{background:rgba(0,0,0,.045)}
.ai-conv-item.active{background:rgba(0,0,0,.07)}
.ai-conv-item-body{flex:1;min-width:0}
.ai-conv-item-title{font-size:14px;font-weight:600;color:#1D1D1F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.ai-conv-item-time{font-size:11px;color:#AEAEB2;margin-top:3px}
.ai-conv-item-del{
  width:22px;height:22px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;
  background:transparent;color:#B8B8BE;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .12s ease,background .12s ease,color .12s ease;
}
.ai-conv-item:hover .ai-conv-item-del{opacity:1}
.ai-conv-item-del:hover{background:#E3E3E6;color:#FF3B30}

/* 左侧空状态 */
.ai-sidebar-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:24px;animation:aiFadeIn .4s ease both;
}
.ai-infinity{color:#D1D1D6;opacity:.75}
.ai-sidebar-empty-text{font-size:24px;font-weight:700;letter-spacing:-.02em;color:#1D1D1F}

/* ===== 右侧主区 ===== */
.ai-main{flex:1;display:flex;flex-direction:column;position:relative;background:#FFFFFF;min-width:0}

/* 顶部毛玻璃按钮 */
.ai-top-btns{
  position:absolute;top:16px;left:16px;right:16px;z-index:5;
  display:flex;justify-content:space-between;pointer-events:none;
}
.ai-top-btn{
  width:36px;height:36px;border-radius:50%;pointer-events:auto;cursor:pointer;
  background:rgba(255,255,255,.8);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
  border:1px solid #D1D1D6;color:#1D1D1F;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.05);
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .15s ease,box-shadow .15s ease;
}
.ai-top-btn:hover{transform:scale(1.08);background:rgba(255,255,255,.96);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.ai-top-btn:active{transform:scale(.9)}

/* 聊天区 */
.ai-chat{flex:1;overflow-y:auto;padding:68px 24px 16px;position:relative;scrollbar-width:thin;scrollbar-color:#E1E1E4 transparent}
.ai-chat::-webkit-scrollbar{width:6px}
.ai-chat::-webkit-scrollbar-thumb{background:#E1E1E4;border-radius:3px}

/* 右侧空状态 */
.ai-chat-empty{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  animation:aiFadeIn .4s ease both;
}
.ai-watermark{opacity:.05;position:absolute;animation:aiFadeIn 1s ease both;pointer-events:none}
.ai-watermark.center{left:50%;top:50%;transform:translate(-50%,-50%)}
.ai-hint{
  position:absolute;right:20px;bottom:40px;
  font-size:12px;color:#8E8E93;letter-spacing:.01em;
  display:flex;align-items:center;gap:8px;
}
.ai-login-btn{
  border:none;background:none;color:#007AFF;font-size:12px;cursor:pointer;font-weight:600;padding:0;
}
.ai-login-btn:hover{text-decoration:underline}

/* 消息 */
.ai-msg{display:flex;margin-bottom:16px;animation:aiMsgIn .28s cubic-bezier(.23,1,.32,1) both}
.ai-msg.user{justify-content:flex-end}
.ai-msg.ai{justify-content:flex-start}
.ai-bubble{
  max-width:76%;padding:10px 16px;border-radius:18px;
  font-size:14px;line-height:1.55;word-break:break-word;
}
.ai-msg.user .ai-bubble{background:#E9E9EB;color:#1D1D1F;border-bottom-right-radius:6px}
.ai-msg.ai .ai-bubble{background:#F5F5F7;color:#1D1D1F;border-bottom-left-radius:6px;border:0.5px solid #ECECEF}
.ai-bubble img{max-width:100%;border-radius:10px;margin-top:6px}
.ai-bubble p{margin:0 0 6px}.ai-bubble p:last-child{margin:0}
.ai-bubble code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:5px;font-size:12px;font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace}
.ai-bubble pre{background:#F0F0F2;padding:12px;border-radius:10px;overflow-x:auto;margin:6px 0}
.ai-bubble pre code{background:none;padding:0}
.ai-bubble ul,.ai-bubble ol{margin:4px 0 8px 20px}
.ai-bubble h1,.ai-bubble h2,.ai-bubble h3{margin:10px 0 6px;line-height:1.3}
.ai-bubble a{color:#007AFF;text-decoration:none}
.ai-bubble a:hover{text-decoration:underline}

/* 思考动画 */
.ai-typing{display:flex;gap:5px;padding:4px 2px}
.ai-typing span{width:7px;height:7px;border-radius:50%;background:#C7C7CC;animation:aiTyping 1.4s infinite ease-in-out}
.ai-typing span:nth-child(2){animation-delay:.2s}
.ai-typing span:nth-child(3){animation-delay:.4s}
@keyframes aiTyping{0%,80%,100%{transform:scale(.6);opacity:.3}40%{transform:scale(1);opacity:.9}}

/* 底部输入区 */
.ai-input-bar{
  height:60px;flex-shrink:0;display:flex;align-items:center;gap:10px;
  padding:0 20px;border-top:1px solid #E6E6E6;background:#FFFFFF;
}
.ai-input{
  flex:1;height:38px;border:1px solid #E6E6E6;border-radius:19px;
  padding:0 18px;font-size:14px;color:#1D1D1F;background:#F7F7F8;outline:none;
  font-family:inherit;transition:background .15s ease,border-color .15s ease,box-shadow .15s ease;
}
.ai-input::placeholder{color:#AEAEB2;font-weight:500}
.ai-input:focus{background:#fff;border-color:#C7C7CC;box-shadow:0 0 0 3px rgba(0,0,0,.03)}
.ai-send{
  width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;
  background:#1D1D1F;color:#fff;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .15s ease,opacity .15s ease;
}
.ai-send:hover{transform:scale(1.08);background:#3A3A3C}
.ai-send:active{transform:scale(.9)}
.ai-send:disabled{opacity:.35;cursor:not-allowed;transform:none}

@keyframes aiFadeIn{from{opacity:0}to{opacity:1}}
@keyframes aiMsgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== 响应式 ===== */
@media(max-width:760px){
  .ai-window{border-radius:0}
  .ai-sidebar{width:40%;min-width:120px}
  .ai-brand{font-size:14px}
  .ai-sidebar-empty-text{font-size:18px}
  .ai-sidebar-empty svg{width:56px;height:56px}
  .ai-chat{padding:68px 14px 12px}
  .ai-input-bar{padding:0 12px}
}
@media(max-width:420px){
  .ai-sidebar{width:36%}
  .ai-conv-item-time{display:none}
}
</style>
</head>
<body>
<div class="ai-window" id="aiWindow">

  <!-- 左侧栏：对话历史 -->
  <aside class="ai-sidebar" id="aiSidebar">
    <div class="ai-sidebar-header">
      <div class="ai-brand">Bird AI</div>
      <button class="ai-back" onclick="goHome()" title="返回论坛" aria-label="返回论坛">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      </button>
    </div>
    <div class="ai-sidebar-search" id="aiSidebarSearch">
      <input type="text" id="aiSearchInput" placeholder="搜索对话..." oninput="filterConvs(this.value)">
      <button class="ss-clear" onclick="closeSearch()" title="关闭搜索" aria-label="关闭搜索">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="ai-conv-list" id="aiConvList"></div>
  </aside>

  <!-- 右侧主区：对话 -->
  <section class="ai-main">
    <div class="ai-top-btns">
      <button class="ai-top-btn" onclick="newConv()" title="新建对话" aria-label="新建对话">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
      </button>
      <button class="ai-top-btn" onclick="toggleSearch()" title="搜索" aria-label="搜索">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
    </div>
    <div class="ai-chat" id="aiChat"></div>
    <div class="ai-input-bar">
      <input type="text" class="ai-input" id="aiInput" placeholder="向我提问..." autocomplete="off" onkeydown="if(event.key==='Enter')sendMessage()">
      <button class="ai-send" onclick="sendMessage()" id="aiSend" title="发送" aria-label="发送">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script>
/* ===== Bird AI · macOS 27 Siri 风格 ===== */
(function(){
  'use strict';
  var LS_KEY = 'bird_ai_convs';
  var _user = null;
  var _convs = [];
  var _curId = null;      // 当前会话 id
  var _thinking = false;

  /* ---------- 工具 ---------- */
  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function loadConvs(){
    try { _convs = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }
    catch(e){ _convs = []; }
  }
  function saveConvs(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(_convs.slice(0, 50))); } catch(e){}
  }
  function convById(id){ return _convs.find(function(c){ return c.id === id; }) || null; }
  function fmtTime(ts){
    var d = new Date(ts);
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    function pad(n){ return n < 10 ? '0' + n : '' + n; }
    if (sameDay) return pad(d.getHours()) + ':' + pad(d.getMinutes());
    if (d.getFullYear() === now.getFullYear()) return (d.getMonth()+1) + '月' + d.getDate() + '日';
    return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
  }

  /* ---------- 渲染：左侧会话列表 ---------- */
  function renderConvList(){
    var list = $('aiConvList');
    var q = ($('aiSearchInput') || {}).value || '';
    var arr = _convs.filter(function(c){
      if (!q) return true;
      return c.title.toLowerCase().indexOf(q.toLowerCase()) !== -1;
    });

    if (_convs.length === 0){
      list.innerHTML =
        '<div class="ai-sidebar-empty">' +
          '<svg class="ai-infinity" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.133-8-12.739-8-4.585 0-4.585 8 0 8 5.606 0 7.644-8 12.74-8z"/></svg>' +
          '<div class="ai-sidebar-empty-text">没有对话</div>' +
        '</div>';
      return;
    }
    if (arr.length === 0){
      list.innerHTML = '<div class="ai-sidebar-empty"><div class="ai-sidebar-empty-text" style="font-size:15px;color:#AEAEB2;font-weight:600">没有匹配的对话</div></div>';
      return;
    }
    list.innerHTML = arr.map(function(c){
      return '<button class="ai-conv-item' + (c.id === _curId ? ' active' : '') + '" onclick="selectConv(' + c.id + ')">' +
        '<span class="ai-conv-item-body">' +
          '<div class="ai-conv-item-title">' + esc(c.title) + '</div>' +
          '<div class="ai-conv-item-time">' + fmtTime(c.time) + '</div>' +
        '</span>' +
        '<span class="ai-conv-item-del" onclick="event.stopPropagation();deleteConv(' + c.id + ')" title="删除">' +
          '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>' +
        '</span>' +
      '</button>';
    }).join('');
  }

  /* ---------- 渲染：右侧对话 ---------- */
  function renderChat(){
    var chat = $('aiChat');
    var conv = convById(_curId);
    var msgs = conv ? conv.messages : [];

    // 空状态：大 ∞ 水印 + 右下角提示
    if (!conv || msgs.length === 0){
      chat.innerHTML =
        '<div class="ai-chat-empty" id="aiChatEmpty">' +
          '<img class="ai-watermark center" src="logo-light.png" alt="Bird" width="150" height="150">' +
          (_user ? '' : '<div class="ai-hint"><button class="ai-login-btn" onclick="goHome()">登录</button></div>') +
        '</div>';
      $('aiInput').placeholder = _user ? '向我提问...' : '请先登录后提问';
      return;
    }

    chat.innerHTML = msgs.map(function(m){
      if (m.role === 'user'){
        return '<div class="ai-msg user"><div class="ai-bubble">' + esc(m.content) + '</div></div>';
      }
      var html = (typeof marked !== 'undefined') ? marked.parse(m.content) : esc(m.content);
      var safe = (typeof DOMPurify !== 'undefined') ? DOMPurify.sanitize(html) : html;
      return '<div class="ai-msg ai"><div class="ai-bubble">' + safe + '</div></div>';
    }).join('');
    chat.scrollTop = chat.scrollHeight;
  }

  function renderAll(){ renderConvList(); renderChat(); }

  /* ---------- 会话操作 ---------- */
  function newConv(){
    _curId = Date.now();
    renderConvList(); renderChat();
    $('aiInput').focus();
  }
  function selectConv(id){
    _curId = id;
    renderConvList(); renderChat();
  }
  function deleteConv(id){
    _convs = _convs.filter(function(c){ return c.id !== id; });
    if (_curId === id) _curId = null;
    saveConvs(); renderAll();
  }
  function currentMessages(){ var c = convById(_curId); return c ? c.messages : []; }
  function upsertCurrent(messages){
    if (!_curId) _curId = Date.now();
    var idx = _convs.findIndex(function(c){ return c.id === _curId; });
    var title = '';
    for (var i = 0; i < messages.length; i++){
      if (messages[i].role === 'user'){ title = messages[i].content; break; }
    }
    title = (title || '新对话').slice(0, 24);
    var time = Date.now();
    if (idx >= 0){
      _convs[idx].messages = messages;
      _convs[idx].title = title;
      _convs[idx].time = time;
    } else {
      _convs.unshift({ id: _curId, title: title, time: time, messages: messages });
    }
    // 按时间排序：最近在前
    _convs.sort(function(a,b){ return b.time - a.time; });
    saveConvs(); renderConvList();
  }
  function showTyping(){
    var chat = $('aiChat');
    var empty = $('aiChatEmpty');
    if (empty) empty.remove();
    var div = document.createElement('div');
    div.className = 'ai-msg ai';
    div.id = 'aiTyping';
    div.innerHTML = '<div class="ai-bubble"><div class="ai-typing"><span></span><span></span><span></span></div></div>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }
  function removeTyping(){ var t = $('aiTyping'); if (t) t.remove(); }

  /* ---------- 发送 ---------- */
  function sendMessage(){
    var input = $('aiInput');
    var content = input.value.trim();
    if (!content) return;
    if (_thinking) return;
    if (!_user){ showToast('请先登录后再使用 AI'); return; }

    var msgs = currentMessages();
    msgs.push({ role: 'user', content: content });
    upsertCurrent(msgs);
    input.value = '';
    renderChat();
    _thinking = true;
    $('aiSend').disabled = true;
    showTyping();

    fetch('/api/ai/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: content })
    }).then(function(r){
      return r.json().then(function(d){ return { ok: r.ok, data: d }; });
    }).then(function(res){
      removeTyping();
      var ms = currentMessages();
      if (res.ok){
        ms.push({ role: 'ai', content: res.data.reply });
      } else {
        ms.push({ role: 'ai', content: '⚠️ ' + (res.data.error || 'AI 回复失败') });
      }
      upsertCurrent(ms);
      renderChat();
    }).catch(function(){
      removeTyping();
      var ms = currentMessages();
      ms.push({ role: 'ai', content: '⚠️ 网络错误，AI 回复失败' });
      upsertCurrent(ms);
      renderChat();
    }).finally(function(){
      _thinking = false;
      $('aiSend').disabled = false;
      $('aiInput').focus();
    });
  }

  /* ---------- 搜索 ---------- */
  function toggleSearch(){
    var box = $('aiSidebarSearch');
    var open = box.classList.toggle('open');
    if (open){ $('aiSearchInput').focus(); }
  }
  function closeSearch(){
    $('aiSidebarSearch').classList.remove('open');
    $('aiSearchInput').value = '';
    renderConvList();
  }
  function filterConvs(){ renderConvList(); }

  /* ---------- 提示 ---------- */
  function showToast(msg){
    var t = document.createElement('div');
    t.style.cssText = 'position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:rgba(29,29,31,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:10px;z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:aiMsgIn .25s ease both;font-family:-apple-system,BlinkMacSystemFont,sans-serif';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2200);
  }

  function goHome(){ location.href = '/'; }

  /* ---------- 初始化 ---------- */
  loadConvs();
  newConv();
  fetch('/api/me', { credentials: 'same-origin', cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(d){ _user = d.user || null; renderChat(); })
    .catch(function(){ _user = null; renderChat(); });

  // 暴露给 inline onclick
  window.newConv = newConv;
  window.selectConv = selectConv;
  window.deleteConv = deleteConv;
  window.sendMessage = sendMessage;
  window.toggleSearch = toggleSearch;
  window.closeSearch = closeSearch;
  window.filterConvs = filterConvs;
  window.goHome = goHome;
})();
</script>
</body>
</html>
